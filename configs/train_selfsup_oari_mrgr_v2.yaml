dataset:
  root: /data/djc/GeoPhy-Set3D/data/processed/geophy_projection_pool_v1
experiment:
  name: selfsup_oari_mrgr_v2_rvtc
  output_root: /data/djc/GeoPhy-Set3D/outputs
loader:
  num_workers: 4
  persistent_workers: true
  pin_memory: true
loss:
  hold: 1.0
  cross: 0.5
  observed: 0.1
  beta: 0.01
  relative_l1: 0.1
  relative_epsilon: 1.0e-06
  measurement_scale: 32284.894580078173
  hold_teacher: 1.0
  observed_teacher: 0.1
  teacher: 0.1
model:
  feature_channels: 32
  input_channels: 3
  lift_resolution: 32
  name: geolift_oari_mrgr_res3d
  output_activation: sigmoid
  output_resolution: 64
  gca:
    distance_scale_m: 6.5
    azimuth_scale_deg: 180.0
  set_interaction:
    d_model: 32
    num_heads: 4
    num_blocks: 1
    ffn_channels: 64
normalization:
  method: linear_p99_5
  statistics_file: train_statistics.json
optimizer:
  lr: 0.0002
  name: adamw
  weight_decay: 0.0001
train:
  split: train
  geometry_pool: train
  a_views:
  - 3
  - 5
  b_views:
  - 3
  - 5
  heldout_views: 2
training:
  batch_size: 1
  device: cuda:2
  early_stopping_patience: null
  gradient_accumulation: 2
  gradient_clip_norm: 1.0
  max_epochs: 300
  precision: fp32
  seed: 20261011
validation:
  split: val
  geometry_pool: train
  a_views:
  - 4
  - 4
  b_views:
  - 4
  - 4
  heldout_views: 4
scheduler:
  name: cosine
  T_max: 300
